<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}AI Ethics Readiness Tool{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">AI Ethics Readiness Tool</a>
      <div>
        <a class="btn btn-outline-light btn-sm me-2" href="{% url 'assessment_form' %}">New Assessment</a>
        <a class="btn btn-outline-light btn-sm" href="{% url 'rules_list' %}">Discovered Rules</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-warning">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
